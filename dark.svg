<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" width="1180" height="370">
<defs>
  <!-- Backgrounds -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020817"/>
    <stop offset="60%" stop-color="#04091a"/>
    <stop offset="100%" stop-color="#020817"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c1628" stop-opacity=".96"/>
    <stop offset="100%" stop-color="#060e1e" stop-opacity=".92"/>
  </linearGradient>

  <!-- Name gradient -->
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#38bdf8;#34d399;#a78bfa" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#34d399;#a78bfa;#22d3ee" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <!-- Animated shimmer border -->
  <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity=".7"><animate attributeName="stop-color" values="#7c3aed;#22d3ee;#10b981;#7c3aed" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="50%"  stop-color="rgba(255,255,255,.05)"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity=".7"><animate attributeName="stop-color" values="#22d3ee;#10b981;#7c3aed;#22d3ee" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <!-- Accent divider -->
  <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#22d3ee;#10b981;#7c3aed" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="80%"  stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#10b981;#7c3aed;#22d3ee" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>

  <!-- Glass highlight -->
  <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <!-- Orb radials -->
  <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#10b981" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
  </radialGradient>

  <!-- Scanline -->
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>

  <!-- Dot pattern -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,.045)"/>
  </pattern>

  <!-- Stat card gradients -->
  <linearGradient id="sc1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e1040"/><stop offset="100%" stop-color="#110921"/></linearGradient>
  <linearGradient id="sc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#082030"/><stop offset="100%" stop-color="#041018"/></linearGradient>
  <linearGradient id="sc3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#072018"/><stop offset="100%" stop-color="#031008"/></linearGradient>
  <linearGradient id="sc4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0e30"/><stop offset="100%" stop-color="#0d0720"/></linearGradient>

  <!-- Typing clips -->
  <clipPath id="t1"><rect x="100" y="86" height="22" width="0"><animate attributeName="width" values="0;0;250;250;0;0" keyTimes="0;.02;.20;.24;.26;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="t2"><rect x="100" y="86" height="22" width="0"><animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;.27;.45;.49;.51;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="t3"><rect x="100" y="86" height="22" width="0"><animate attributeName="width" values="0;0;248;248;0;0" keyTimes="0;.52;.70;.74;.76;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="t4"><rect x="100" y="86" height="22" width="0"><animate attributeName="width" values="0;0;172;172;0;0" keyTimes="0;.77;.95;.99;1;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>

  <!-- Filters -->
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="drop"><feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#000" flood-opacity=".6"/></filter>
  <filter id="pg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <style>
    .pill { cursor:pointer; }
    .pill rect { transition:all .25s; }
    .pill:hover rect { fill:rgba(34,211,238,.18)!important; stroke:#22d3ee!important; }
    .pill:hover text { fill:#fff!important; }
    .soc { cursor:pointer; }
    .soc rect { transition:all .25s; }
    .soc:hover rect { fill:rgba(34,211,238,.10)!important; stroke:#22d3ee!important; }
    .soc:hover text { fill:#22d3ee!important; }
    .card { cursor:default; }
    .card rect { transition:all .3s; }
    .card:hover rect { opacity:.9; }
  </style>
</defs>

<!-- ── BASE ── -->
<rect width="1180" height="520" rx="20" fill="url(#bg)"/>
<rect width="1180" height="520" rx="20" fill="url(#dots)"/>

<!-- ── AMBIENT ORBS ── -->
<g filter="url(#glow)" opacity=".9">
  <circle cx="200"  cy="180" r="280" fill="url(#orbB)">
    <animateTransform attributeName="transform" type="translate" values="0,0;35,20;-18,32;0,0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="140" r="260" fill="url(#orbA)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-30,-18;22,-30;0,0" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650"  cy="480" r="220" fill="url(#orbC)">
    <animateTransform attributeName="transform" type="translate" values="0,0;18,-22;-28,10;0,0" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="420" r="160" fill="url(#orbB)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-15,12;10,-15;0,0" dur="21s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ── FLOATING PARTICLES ── -->
<circle cx="88"   cy="120" r="1.5" fill="#22d3ee" opacity=".35">
  <animate attributeName="cy" values="120;65;120" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".12;.6;.12" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="1120" cy="330" r="1.5" fill="#10b981" opacity=".3">
  <animate attributeName="cy" values="330;285;330" dur="11s" repeatCount="indefinite"/>
</circle>
<circle cx="950"  cy="65"  r="2"   fill="#a78bfa" opacity=".4">
  <animate attributeName="cy" values="65;28;65" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="310"  cy="455" r="1"   fill="#22d3ee" opacity=".28">
  <animate attributeName="cy" values="455;410;455" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="740"  cy="490" r="1.5" fill="#f472b6" opacity=".28">
  <animate attributeName="cy" values="490;455;490" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="490"  cy="55"  r="1"   fill="#34d399" opacity=".3">
  <animate attributeName="cy" values="55;20;55" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- ── OUTER BORDER ── -->
<rect x="6" y="6" width="1168" height="358" rx="18" fill="none" stroke="url(#shimmer)" stroke-width="1.5"/>

<!-- ── MAIN PANEL ── -->
<rect x="26" y="24" width="1128" height="324" rx="16" fill="url(#panel)" filter="url(#drop)"/>
<rect x="26" y="24" width="1128" height="90"  rx="16" fill="url(#glassTop)"/>
<rect x="26" y="24" width="1128" height="324" rx="16" fill="none" stroke="url(#shimmer)" stroke-width="1"/>

<!-- ── TERMINAL HEADER ── -->
<rect x="26" y="24" width="1128" height="38" rx="16" fill="rgba(5,10,20,.9)"/>
<line x1="26" y1="62" x2="1154" y2="62" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
<circle cx="54"  cy="43" r="6" fill="#ff5f56"/>
<circle cx="76"  cy="43" r="6" fill="#ffbd2e"/>
<circle cx="98"  cy="43" r="6" fill="#27c93f"/>
<rect x="462" y="31" width="256" height="22" rx="6" fill="rgba(255,255,255,.042)"/>
<text x="590" y="46" font-family="'Fira Code',monospace" font-size="10.5" fill="#334155" text-anchor="middle">mudit@bhopal — ~/github-profile</text>
<text x="1110" y="46" font-family="'Fira Code',monospace" font-size="10" fill="#1e293b" text-anchor="end">v2.0.1</text>

<!-- ── SCANLINE ── -->
<rect x="26" y="62" width="1128" height="26" fill="url(#scan)">
  <animate attributeName="y" values="62;342;62" dur="4.5s" repeatCount="indefinite"/>
</rect>

